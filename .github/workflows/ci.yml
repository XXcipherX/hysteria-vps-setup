name: ci

on:
  push:
    branches: [master, feat/mtproto-wdtt-compat]
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gettext-base nftables python3-yaml shellcheck

      - name: Syntax
        run: bash -n vps-setup.sh scripts/*.sh tests/*.sh

      - name: ShellCheck
        run: shellcheck -x --severity=warning vps-setup.sh scripts/*.sh tests/*.sh

      - name: Template smoke
        run: bash tests/smoke.sh

      - name: Firewall dry run
        run: |
          sudo HVS_DRY_RUN=1 \
            HVS_CONF_DIR="$RUNNER_TEMP/hysteria-vps-conf" \
            HVS_STATE_DIR="$RUNNER_TEMP/hysteria-vps-state" \
            SSH_PORT=22 \
            bash scripts/firewall.sh apply
